# Socket.IO over WebSocket. A socket stays open for the whole session; Socket.IO
# pings every 25 s, so the hour-long timeouts only end truly dead connections.
location /socket.io/ {
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_pass $api_upstream;
}
