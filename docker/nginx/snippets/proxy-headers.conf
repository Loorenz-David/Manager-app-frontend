# Request forwarding to the backend. Included inside a `location` that proxies.

proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $forwarded_proto;

# The client address is REPLACED, not appended to. The backend takes the first entry
# of X-Forwarded-For for sign-in rate limiting and audit logs, so appending (as the
# legacy server does) would let a client choose its own address by sending the
# header. $remote_addr is the real peer, or, when REAL_IP_TRUSTED_CIDRS names a load
# balancer in front, the client address that load balancer reported.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;

# WebSocket upgrade for Socket.IO; ordinary requests keep a normal Connection header.
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Fail fast when the API is down: a 502 within 5 s, not a hanging page. Read and
# send timeouts are set by each location (ordinary requests vs. long-lived sockets).
proxy_connect_timeout 5s;
