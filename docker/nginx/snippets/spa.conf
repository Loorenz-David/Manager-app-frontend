# Static single-page application. Included in each app's server block after `root`.

index index.html;

# Vite's build output: every file name carries a content hash, so a file never
# changes under the same name and can be cached for a year. A missing file is a 404,
# never index.html — HTML served as JavaScript would be cached for a year too.
location /assets/ {
    try_files $uri =404;
    # Without `always`: a 404 must not be cached for a year.
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Everything else: index.html, the service worker (sw.js, registerSW.js), the web
# manifest, icons and other unhashed files. `no-cache` means "revalidate before use",
# so a release is picked up on the next load; unchanged files cost a 304.
# Unknown paths fall back to index.html so client-side routes work on reload.
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
}
