# Same-origin backend routes, included in every application server block, so the
# browser can call /api and /socket.io on the domain it loaded the app from.

# Requests are capped at 30 s by the backend itself; 90 s is only a backstop.
location /api/ {
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;
    proxy_pass $api_upstream;
}

include /etc/nginx/snippets/socketio.conf;
