# Shared by every server block (included inside `http {}`).

server_tokens off;

# Redirects must not carry the container's internal port (8080) or hostname.
absolute_redirect off;

# Largest request body the backend accepts through the proxy, as on the legacy
# server. File uploads go straight to S3 and do not pass through here.
client_max_body_size 25m;

# WebSocket upgrade for proxied Socket.IO connections; plain requests send an empty
# Connection header instead of "upgrade".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# Keep "https" when a TLS terminator in front says so; otherwise the scheme this
# proxy received (plain HTTP inside the deployment).
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

# Missing from the stock mime.types; the PWA manifest would otherwise be served as
# application/octet-stream.
types {
    application/manifest+json webmanifest;
}

# Text assets are precompressed at build time (.gz next to each file); anything
# without a .gz is compressed on the fly.
gzip_static on;
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    font/ttf;

# Anything that is not one of the application hostnames: 404, plus a liveness
# endpoint that never reaches the backend (so it cannot wake the app from sleep mode).
server {
    listen 8080 default_server;
    server_name _;

    location = /__health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
